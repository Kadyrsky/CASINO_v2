[package]
name = "deadlock-bot"
version = "0.1.0"
edition = "2024"
description = "Talks to Deadlock's game coordinator through a Steam account: live matches, spectate links and match results."
publish = false

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
bzip2 = "0.6"
clap = { version = "4.6.1", features = ["derive", "env"] }
directories = "6"
env_logger = "0.11.10"
log = "0.4.29"
prost = "0.14.3"
redis = { version = "1.8", default-features = false, features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
snap = "1"
tracing = { version = "0.1", features = ["log"] }
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
zstd = "0.13"

# Broadcast parser for the live map (BSD-3-Clause). It brings its own reqwest 0.12, which its HTTP client trait is
# implemented for, so that version is named here too.
haste = { git = "https://github.com/blukai/haste", rev = "d2cdbf2cc13cadf12ec6c6b765f689a5894a6b36", features = ["broadcast", "deadlock"] }
reqwest012 = { package = "reqwest", version = "0.12", default-features = false, features = ["gzip"] }

# Same pins as deadlock-api's own tools (deadlock-api-ingest), so the Steam and GC code matches theirs.
steam-vent = { git = "https://github.com/deadlock-api/steam-vent", rev = "098ae675ab698d642e93c4c650cab79f3fc7d130" }
valveprotos = { git = "https://github.com/deadlock-api/deadlock-api", rev = "328a51b6b1857a9092d3dd1e5c79609a2e61202d", features = ["gc-client"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

# haste's var-type parser with a fix for the multi-argument templates in current Deadlock broadcasts (see
# vendor/haste_vartype/Cargo.toml). Without it, every broadcast fails with "unknown char ,".
[patch."https://github.com/blukai/haste"]
haste_vartype = { path = "vendor/haste_vartype" }
