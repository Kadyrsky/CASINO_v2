# SNI router on the server's public port 443 (the port is shared with the Amnezia VPN, see deploy/README.md).
# It only reads the TLS ClientHello's server name and forwards the encrypted stream untouched:
#   poker.naebka.win  -> Caddy (127.0.0.1:8443), with the client's IP in a PROXY protocol header
#   anything else     -> amnezia-xray (127.0.0.1:8444; its Reality camouflage name is another site)
global
    log stdout format raw local0 notice
    maxconn 4096

defaults
    mode tcp
    log global
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h

frontend tls_in
    bind :::443 v4v6
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }
    use_backend web if { req_ssl_sni -i poker.naebka.win }
    default_backend vpn

backend web
    server caddy 127.0.0.1:8443 send-proxy-v2

backend vpn
    server xray 127.0.0.1:8444
