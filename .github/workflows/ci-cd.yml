# CI: tests on every push and pull request.
# CD: on a push to main (after the tests pass) the core and live images are built here, pushed to GHCR, and the
# server (deploy/README.md) pulls and restarts them. The server never builds anything.
# Versions: every push to main is a release with a MAJOR.MINOR.PATCH number worked out from what was merged
# (docs/versioning.md). The version job finds the number, the images are built with it, the release job tags it.
#
# Repository secrets used by the deploy job (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST          server IP or hostname
#   DEPLOY_USER          SSH user on the server (in the docker group)
#   DEPLOY_SSH_KEY       private key whose public half is in the user's ~/.ssh/authorized_keys
#   DEPLOY_KNOWN_HOSTS   output of `ssh-keyscan <host>` (pins the server's host key)
name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/kadyrsky/casino_v2

jobs:
  core:
    name: Core (Java unit + integration tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21", cache: maven }
      # -Pit = unit + Testcontainers integration tests (Docker is available on GitHub runners).
      - run: mvn -B -Pit test
        working-directory: core

  live:
    name: Live (pytest + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: live/pyproject.toml }
      - run: pip install -e ".[dev]"
        working-directory: live
      - run: python -m pytest && python -m mypy naebka_live tests
        working-directory: live

  frontend:
    name: Frontend (types, lint, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm install --no-audit --no-fund && npx tsc --noEmit && npx vp lint src && npx vp test run && npm run build
        working-directory: frontend

  # The realtime map in a real Chromium (WebGL in software) against the mock core: frontend/e2e.
  frontend-browser:
    name: Frontend (live map in a browser, Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx tsc --noEmit -p e2e && npx vp lint e2e playwright.config.ts && npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: frontend/playwright-report, retention-days: 14 }

  # The 3D map's builder (frontend/scripts/map_model.py) on made-up maps; the files it made are tested by `frontend`.
  map-builder:
    name: Map builder (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.14" }
      - run: pip install numpy pillow pytest && python -m pytest scripts/tests
        working-directory: frontend

  # The Steam bot isn't deployed from here (deadlock-bot/README.md), but its live frames feed the map: tests and lints.
  bot:
    name: Steam bot (cargo test, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            deadlock-bot/target
          key: bot-${{ runner.os }}-${{ hashFiles('deadlock-bot/Cargo.lock') }}
          restore-keys: bot-${{ runner.os }}-
      - run: cargo clippy --locked --all-targets -- -D warnings && cargo test --locked
        working-directory: deadlock-bot

  contracts:
    name: Contracts (Hardhat)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: npm, cache-dependency-path: contracts/package-lock.json }
      - run: npm ci && npx hardhat test
        working-directory: contracts

  security:
    name: Security (dependency vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Every lockfile (Java, npm, Rust, contracts): fail on a HIGH or CRITICAL vulnerability that has a fix.
      # Dependabot (.github/dependabot.yml) opens the pull requests that bring those fixes in.
      - run: >-
          docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.57.1 fs --quiet --exit-code 1
          --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed /src
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: contracts

  # The version (docs/versioning.md). On a push to main: the number this run releases, from the newest vX.Y.Z tag and
  # the pull requests merged since (their labels, titles and branches). On a pull request: the number merging it would
  # make, in the run's summary. The script's own tests run every time.
  version:
    name: Version (next release number)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      previous_tag: ${{ steps.next.outputs.previous_tag }}
      baseline_commit: ${{ steps.next.outputs.baseline_commit }}
      release: ${{ steps.next.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        # Every commit and tag, to see what came after the newest tag; file contents only for this commit.
        with: { fetch-depth: 0, filter: "blob:none" }
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - run: node --test .github/scripts/next-version.test.mjs
      - id: next
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: node .github/scripts/next-version.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    name: Build and push images
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [version, core, live, frontend, frontend-browser, contracts, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: core/Dockerfile
          # The music is in the repository; skip = use it as it is and never ask deadlock.wiki (which refuses GitHub's
          # runners with HTTP 403 anyway). NAEBKA_VERSION is the number the site shows under its name.
          build-args: |
            MUSIC=skip
            NAEBKA_VERSION=${{ needs.version.outputs.version }}
          push: true
          # Tagged with the commit, the version and latest.
          tags: |
            ${{ env.IMAGE_PREFIX }}-core:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-core:${{ needs.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}-core:latest
          cache-from: type=gha,scope=core
          cache-to: type=gha,scope=core,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: live
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-live:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-live:${{ needs.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}-live:latest
          cache-from: type=gha,scope=live
          cache-to: type=gha,scope=live,mode=max

  # Tags the commit vX.Y.Z once its images are pushed, and publishes a GitHub release with the pull requests merged
  # since the previous one. No endless loop of runs: nothing here pushes a commit, this workflow runs for branch pushes
  # and pull requests but not for tags or releases, and GitHub starts no runs for what GITHUB_TOKEN creates anyway.
  release:
    name: Release (version tag)
    needs: [version, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag the commit and publish the release
        if: needs.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.version.outputs.previous_tag }}
          BASELINE_COMMIT: ${{ needs.version.outputs.baseline_commit }}
        run: |
          # The first release also tags the version main had reached before (docs/versioning.md), so its notes start
          # there. What exists already is left alone, so re-running a failed job carries on where it stopped.
          if [ -n "$BASELINE_COMMIT" ] && ! gh api "repos/$GH_REPO/git/ref/tags/$PREVIOUS_TAG" --silent 2>/dev/null; then
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$PREVIOUS_TAG" -f sha="$BASELINE_COMMIT" --silent
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes --notes-start-tag "$PREVIOUS_TAG"
          fi

  deploy:
    name: Deploy to server
    needs: [images, release]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://poker.naebka.win
    concurrency: { group: deploy-production, cancel-in-progress: false }
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          printf 'Host target\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n' \
            "${{ secrets.DEPLOY_HOST }}" "${{ secrets.DEPLOY_USER }}" > ~/.ssh/config
      - name: Upload compose files
        run: scp deploy/docker-compose.prod.yml deploy/Caddyfile deploy/haproxy.cfg deploy/server-deploy.sh target:/opt/naebka/
      - name: Pull images and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | ssh target "bash /opt/naebka/server-deploy.sh '${{ github.sha }}' '${{ github.actor }}'"
