server:
  port: 8081
  forward-headers-strategy: framework

spring:
  application.name: naebka-core
  datasource:
    url: jdbc:postgresql://localhost:55432/naebka
    username: naebka
    password: naebka
    hikari:
      maximum-pool-size: 20
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 56379
  mvc:
    problemdetails:
      enabled: true
  # Several threads, so a slow match-result request in settlement can't delay the STALE watchdog.
  task:
    scheduling:
      pool:
        size: 4
  jackson:
    default-property-inclusion: non_null

management:
  endpoints.web.exposure.include: health,info

springdoc:
  api-docs.path: /api/openapi.json
  swagger-ui.path: /api/docs

naebka:
  # PLAY_MONEY | REAL_MONEY. REAL_MONEY requires license-signoff-file to exist (Risk #13).
  currency-mode: PLAY_MONEY
  license-signoff-file: /etc/naebka/license-signoff.json
  # Display rule: winnings are shown in real money at a fixed rate (High-Level Design §1).
  token-fiat-rate: 0.10
  fiat-currency: EUR
  jwt:
    secret: dev-only-secret-change-me-dev-only-secret-change-me
    ttl-minutes: 60
  admin:
    username: admin
    password: admin12345
  registration:
    min-age: 18
    # ISO 3166-1 alpha-2 (United Kingdom = GB, Greece = GR, North Macedonia = MK, Montenegro = ME).
    licensed-countries: [GB, MT, SE, DK, CZ, NL, HR, EE, IT, LV, CH, RO, ES, LT, MK, DE, HU, ME, SI, PT, BE, IE, BG, GR, RS, SK]
  kyc:
    # Until VERIFIED: no withdrawals, and lifetime deposits (signup bonus excluded) are capped at this.
    unverified-deposit-cap-tokens: 2000
    # A KYC submission within this many days of a date-of-birth/country change goes to manual review.
    profile-change-review-days: 30
    # HMAC key for document-number hashes (duplicate detection without storing the number).
    document-hash-key: dev-only-kyc-key-change-me
  auth:
    max-failed-logins: 5
    lockout-minutes: 15
    # Stops bots from mass-creating accounts (each gets the signup bonus).
    registrations-per-ip-per-hour: 10
  wallet:
    max-deposit-tokens: 10000
    signup-bonus-tokens: 1000
  betting:
    min-stake-tokens: 1
    max-stake-tokens: 5000
    # Courtsiding defense: bets are re-validated after this delay (Technical Design: suspend-then-reprice).
    acceptance-delay-ms: 1500
    bets-per-minute: 30
    # A match with no watcher event for this long is marked STALE and suspended (Risk #14).
    stale-after-seconds: 60
    # Plausibility band: odds outside it keep the market suspended (Risk #11).
    min-odds: 1.01
    max-odds: 51.0
  settlement:
    poll-seconds: 30
    # Give up auto-settlement and route to manual review after this long without a report.
    review-after-minutes: 180
  poker:
    turn-timeout-seconds: 30
    reconnect-grace-seconds: 30
    rake-percent: 5
    rake-cap-big-blinds: 3
    min-buy-in-big-blinds: 20
    max-buy-in-big-blinds: 100
    block-same-ip: true
  deadlock-api:
    base-url: https://api.deadlock-api.com
    timeout-seconds: 10
  # The team's Steam bot (deadlock-bot/, `serve` mode). Asked for match results only when deadlock-api refuses
  # ("too many requests") or is down. Empty base-url = off.
  deadlock-bot:
    base-url: ""
    token: ""
    # Covers a Steam login when the bot's session is closed.
    timeout-seconds: 30
  # Realtime map (deadlock-bot follows the broadcasts). Admins and premium players may always watch; others need this
  # many tokens staked on the match (0 = any logged-in player). Frames reach viewers delay-seconds after the core gets
  # them, so markets suspend first.
  live-view:
    min-stake-tokens: 100
    delay-seconds: 5
  # MetaMask + Sepolia deposits (course web3 lab). Sepolia ETH is test money, so this stays PLAY_MONEY.
  eth:
    chain-id: 11155111
    rpc-url: https://ethereum-sepolia-rpc.publicnode.com
    # Empty = feature off. Set NAEBKA_ETH_CONTRACT_ADDRESS to the NaebkaCashier address deployed from Remix.
    contract-address: ""
    # Block the contract was deployed in (Etherscan shows it). 0 = start near the current block.
    deploy-block: 0
    # Blocks to wait before crediting: inclusion in one block is not finality.
    confirmations: 3
    poll-seconds: 15
    # Blocks per eth_getLogs call; public RPCs reject large ranges.
    max-block-range: 500
    # 0.001 Sepolia ETH = 100 NTK
    tokens-per-eth: 100000
    # Must match the address players open, or MetaMask warns about the sign-in message.
    siwe-domain: localhost:8080
    siwe-uri: http://localhost:8080
    link-message-ttl-seconds: 300
    # Withdrawals to MetaMask: private key (0x + 64 hex) of the contract's operator account, a Sepolia test account
    # that only pays gas. Empty = withdrawals off. Never use a key that holds real money.
    operator-key: ""
    # A payout never pays more than this per gas unit (Sepolia is usually far below it); above it, payouts wait.
    max-fee-gwei: 50
    payout-gas-limit: 150000
