# Reverse proxy (System Architecture Design: "Docker Compose behind an Nginx reverse proxy").
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Re-resolve the core container through Docker's DNS, so a restarted core (new IP) is picked up.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $core http://core:8081;

    location /api/ {
        proxy_pass $core;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /ws {
        proxy_pass $core;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing: unknown paths serve index.html
    location / {
        try_files $uri /index.html;
    }
}
